trigger:
  batch: true
  branches:
    include:
    - main
    - release/*

pr: none

variables:
- template: /eng/common-variables.yml@self
- template: /eng/common/templates-official/variables/pool-providers.yml@self
- name: LinuxImage
  value: build.azurelinux.3.amd64
- name: WindowsImage
  value: windows.vs2022.amd64
- name: MacImage
  value: macOS-14
- name: CheckNuGetSizesScript
  value: >-
    $nupkgs_large=(Get-ChildItem artifacts/packages/$(_BuildConfig)/Shipping -recurse -include "*.nupkg" | Select-Object Name,Length | Where-Object { $_.Length -gt 250*1MB });
    if ($nupkgs_large.Length -gt 0) { Write-Error "NuGet size exceeds 250MiB: $($nupkgs_large | Format-Table | Out-String)"; exit 1 }

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: DefaultDeny
    sdl:
      tsa:
        enabled: true
      policheck:
        enabled: true
      binskim:
        scanOutputDirectoryOnly: true
      sourceAnalysisPool:
        name: $(DncEngInternalBuildPool)
        image: $(WindowsImage)
        os: windows
    stages:
    - stage: build
      displayName: Build
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enablePublishBuildArtifacts: true
          enablePublishBuildAssets: true
          enableMicrobuild: true

          jobs:
          ############ macOS BUILD ############
          - job: Build_macOS_x64
            displayName: macOS_x64
            timeoutInMinutes: 120
            pool:
              name: Azure Pipelines
              image: $(MacImage)
              os: macOS
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - bash: ./build.sh
                --ci
                --prepareMachine
                --configuration $(_BuildConfig)
                --pack
                /p:TargetOS=osx
                /p:TargetArchitecture=x64
                /p:TargetRid=osx-x64
                $(_InternalBuildArgs)
              displayName: Build and Pack
            - task: 1ES.PublishPipelineArtifact@1
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages
                artifactName: Packages_macOS_x64
            - bash: |
                rm -rf binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes

          - job: Build_macOS_arm64
            displayName: macOS_arm64
            timeoutInMinutes: 120
            pool:
              name: Azure Pipelines
              image: $(MacImage)
              os: macOS
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - bash: ./build.sh
                --ci
                --prepareMachine
                --configuration $(_BuildConfig)
                --pack
                /p:TargetOS=osx
                /p:TargetArchitecture=arm64
                /p:TargetRid=osx-arm64
                $(_InternalBuildArgs)
              displayName: Build and Pack
            - task: 1ES.PublishPipelineArtifact@1
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages
                artifactName: Packages_macOS_arm64
            - bash: |
                rm -rf binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
          
          ############ Linux BUILD ############
          - job: Build_linux_x64
            displayName: Linux_x64
            timeoutInMinutes: 120
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - bash: ./build.sh
                --ci
                --prepareMachine
                --configuration $(_BuildConfig)
                --pack
                /p:TargetOS=linux
                /p:TargetArchitecture=x64
                /p:TargetRid=linux-x64
                $(_InternalBuildArgs)
              displayName: Build and Pack
            - task: 1ES.PublishPipelineArtifact@1
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages
                artifactName: Packages_linux_x64
            - bash: |
                rm -rf binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
          
          - job: Build_linux_arm64
            displayName: Linux_arm64
            timeoutInMinutes: 120
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - bash: ./build.sh
                --ci
                --prepareMachine
                --configuration $(_BuildConfig)
                --pack
                /p:TargetOS=linux
                /p:TargetArchitecture=arm64
                /p:TargetRid=linux-arm64
                $(_InternalBuildArgs)
              displayName: Build and Pack
            - task: 1ES.PublishPipelineArtifact@1
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages
                artifactName: Packages_linux_arm64
            - bash: |
                rm -rf binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes

          - job: Build_linux_musl_x64
            displayName: Linux_musl_x64
            timeoutInMinutes: 120
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - bash: ./build.sh
                --ci
                --prepareMachine
                --configuration $(_BuildConfig)
                --pack
                /p:TargetOS=linux-musl
                /p:TargetArchitecture=x64
                /p:TargetRid=linux-musl-x64
                $(_InternalBuildArgs)
              displayName: Build and Pack
            - task: 1ES.PublishPipelineArtifact@1
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages
                artifactName: Packages_linux_musl_x64
            - bash: |
                rm -rf binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
          
          - job: Build_linux_musl_arm64
            displayName: Linux_musl_arm64
            timeoutInMinutes: 120
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - bash: ./build.sh
                --ci
                --prepareMachine
                --configuration $(_BuildConfig)
                --pack
                /p:TargetOS=linux-musl
                /p:TargetArchitecture=arm64
                /p:TargetRid=linux-musl-arm64
                $(_InternalBuildArgs)
              displayName: Build and Pack
            - task: 1ES.PublishPipelineArtifact@1
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages
                artifactName: Packages_linux_musl_arm64
            - bash: |
                rm -rf binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes
  
          ############ Windows BUILD ############
          - job: Build_win_x64
            displayName: Windows_x64
            timeoutInMinutes: 240
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(WindowsImage)
              os: windows
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - script: build.cmd
                -ci
                -prepareMachine
                -configuration $(_BuildConfig)
                -pack
                -sign
                -publish
                /p:TargetOS=windows
                /p:TargetArchitecture=x64
                /p:TargetRid=win-x64
                $(_InternalBuildArgs)
              displayName: Build and Publish
            - script: |
                rmdir /s /q binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes

          - job: Build_win_arm64
            displayName: Windows_arm64
            timeoutInMinutes: 240
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(WindowsImage)
              os: windows
            steps:
            - task: npmAuthenticate@0
              displayName: Authenticate NPM Feed
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc
            - script: build.cmd
                -ci
                -prepareMachine
                -configuration $(_BuildConfig)
                -pack
                -sign
                -publish
                /p:TargetOS=windows
                /p:TargetArchitecture=arm64
                /p:TargetRid=win-arm64
                $(_InternalBuildArgs)
              displayName: Build and Publish
            - script: |
                rmdir /s /q binaryen node python llvm emscripten
              displayName: Remove temporary artifacts
            - powershell: $(CheckNuGetSizesScript)
              displayName: Check NuGet sizes

          # Signing Unix packages on Windows avoids installing signing tooling on the build hosts.
          # Keep macOS separate so its binary signing rules do not apply to Linux tools named node.
          - job: Sign_macOS
            displayName: Sign and Publish macOS Packages
            timeoutInMinutes: 120
            dependsOn:
            - Build_macOS_x64
            - Build_macOS_arm64
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(WindowsImage)
              os: windows
            steps:
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: Packages_macOS_x64
                targetPath: artifacts/packages
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: Packages_macOS_arm64
                targetPath: artifacts/packages
            - powershell: >
                ./eng/common/build.ps1 -ci -configuration $(_BuildConfig) -restore -sign -publish
                /p:TargetOS=osx /p:TargetRid=osx-x64
                /p:AssetManifestFileName=osx-all.xml $(_InternalBuildArgs)
              displayName: Sign and Publish

          - job: Sign_linux
            displayName: Sign and Publish Linux Packages
            timeoutInMinutes: 120
            dependsOn:
            - Build_linux_x64
            - Build_linux_arm64
            - Build_linux_musl_x64
            - Build_linux_musl_arm64
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(WindowsImage)
              os: windows
            steps:
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: Packages_linux_x64
                targetPath: artifacts/packages
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: Packages_linux_arm64
                targetPath: artifacts/packages
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: Packages_linux_musl_x64
                targetPath: artifacts/packages
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: Packages_linux_musl_arm64
                targetPath: artifacts/packages
            - powershell: >
                ./eng/common/build.ps1 -ci -configuration $(_BuildConfig) -restore -sign -publish
                /p:TargetOS=linux /p:TargetRid=linux-x64
                /p:AssetManifestFileName=linux-all.xml $(_InternalBuildArgs)
              displayName: Sign and Publish

    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        enableSigningValidation: true
        enableNugetValidation: true
        enableSymbolValidation: false